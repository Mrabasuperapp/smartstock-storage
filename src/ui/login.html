<!doctype html>
<html lang="en" class="no-js"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/><title>Zebra Sign in</title>
<link rel="stylesheet" href="/ui/console.css"/>
<script>document.documentElement.classList.replace("no-js","js")</script></head>
<body class="in"><main class="login">
  <section class="art" id="art"><div class="stripes"></div>
    <h1><span class="mask" style="--i:0"><span>Storage that</span></span><span class="mask" style="--i:1"><span>knows what</span></span><span class="mask" style="--i:2"><span>it holds.</span></span></h1>
  </section>
  <section class="form-side">
    <form id="f" class="form fade" style="--i:3">
      <div class="brand"><span class="mark"></span>Zebra</div>
      <label>Username<input class="field" name="username" autocomplete="username" required autofocus/></label>
      <label>Password<input class="field" name="password" type="password" autocomplete="current-password" required/></label>
      <button class="btn primary" type="submit">Sign in</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </section>
</main>
<script>
const f=document.getElementById("f"),err=document.getElementById("err"),art=document.getElementById("art");
requestAnimationFrame(()=>document.body.classList.add("in"));
art.addEventListener("pointermove",e=>{const r=art.getBoundingClientRect();art.style.setProperty("--mx",(e.clientX-r.left)/r.width*100+"%");art.style.setProperty("--my",(e.clientY-r.top)/r.height*100+"%")},{passive:true});
f.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";
  const res=await fetch("/auth/session",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:f.username.value,password:f.password.value})});
  if(!res.ok){err.textContent=(await res.json().catch(()=>({}))).message||"Sign in failed";return}
  location.href="/admin/storage"});
</script></body></html>
