<!doctype html>
<html lang="en" class="no-js"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/><title>Zebra Sign in</title>
<link rel="stylesheet" href="/storage/ui/console.css"/>
<script>document.documentElement.classList.replace("no-js","js")</script>
<script src="/storage/ui/theme.js"></script></head>
<body class="in"><button class="themebtn" type="button" data-theme-toggle></button><main class="login">
  <section class="art" id="art"><div class="stripes"></div>
    <h1><span class="mask" style="--i:0"><span>Storage that</span></span><span class="mask" style="--i:1"><span>knows what</span></span><span class="mask" style="--i:2"><span>it holds.</span></span></h1>
  </section>
  <section class="form-side">
    <div class="form fade" style="--i:3">
      <div class="brand"><span class="mark"></span>Zebra</div>
      <h2 style="font-size:1.6rem">Welcome back.</h2>
      <p class="muted" style="margin:0">Sign in with the Google account that has access to this storage.</p>
      <button class="btn google" id="google" type="button">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <div class="err" id="err" role="alert"></div>
    </div>
  </section>
</main>
<script>
const err=document.getElementById("err"),art=document.getElementById("art"),btn=document.getElementById("google");
const FIREBASE_VERSION="11.10.0";
requestAnimationFrame(()=>document.body.classList.add("in"));
art.addEventListener("pointermove",e=>{const r=art.getBoundingClientRect();art.style.setProperty("--mx",(e.clientX-r.left)/r.width*100+"%");art.style.setProperty("--my",(e.clientY-r.top)/r.height*100+"%")},{passive:true});
let firebase;
async function firebaseAuth(){
  if(firebase)return firebase;
  const config=(await (await fetch("/storage/auth/config")).json()).firebase;
  const [{initializeApp},auth]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`)]);
  const app=initializeApp(config);
  firebase={auth:auth.getAuth(app),provider:new auth.GoogleAuthProvider(),signInWithPopup:auth.signInWithPopup,signOut:auth.signOut};
  firebase.provider.setCustomParameters({prompt:"select_account"});
  return firebase;
}
btn.addEventListener("click",async()=>{
  err.textContent="";btn.disabled=true;
  try{
    const fb=await firebaseAuth();
    const credential=await fb.signInWithPopup(fb.auth,fb.provider);
    const idToken=await credential.user.getIdToken(true);
    const res=await fetch("/storage/auth/session",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({idToken})});
    await fb.signOut(fb.auth).catch(()=>{});
    if(!res.ok){err.textContent=(await res.json().catch(()=>({}))).message||"Sign in failed";return}
    location.href="/storage/admin";
  }catch(e){
    const code=e&&e.code||"";
    if(/popup-closed|cancelled-popup/.test(code))return;
    err.textContent=/unauthorized-domain/.test(code)?"This domain is not authorised in Firebase Authentication. Add it under Authentication > Settings > Authorized domains.":(e&&e.message)||"Sign in failed";
  }finally{btn.disabled=false}
});
</script></body></html>
